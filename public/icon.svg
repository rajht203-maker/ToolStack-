<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="toolstack-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#312e81" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#toolstack-grad)" />

  <!-- Subtle glow layer -->
  <circle cx="256" cy="180" r="160" fill="url(#accent-grad)" opacity="0.18" filter="blur(30px)" />

  <!-- Stacked Tool Cards / Layer glyphs -->
  <g filter="url(#shadow)" transform="translate(0, 8)">
    <!-- Bottom layer -->
    <rect x="146" y="310" width="220" height="42" rx="14" fill="#ffffff" fill-opacity="0.25" />

    <!-- Middle layer -->
    <rect x="126" y="250" width="260" height="46" rx="16" fill="#ffffff" fill-opacity="0.45" />

    <!-- Top layer card -->
    <rect x="106" y="150" width="300" height="86" rx="20" fill="#ffffff" />
    
    <!-- Accent line inside top card -->
    <rect x="136" y="180" width="64" height="26" rx="8" fill="url(#toolstack-grad)" />
    <circle cx="230" cy="193" r="8" fill="#4f46e5" />
    <circle cx="260" cy="193" r="8" fill="#6366f1" />
    <circle cx="290" cy="193" r="8" fill="#818cf8" />
    <rect x="320" y="187" width="56" height="12" rx="6" fill="#cbd5e1" />
  </g>

  <!-- Sparkle top right -->
  <path d="M380 90 L390 115 L415 125 L390 135 L380 160 L370 135 L345 125 L370 115 Z" fill="#38bdf8" />
  <circle cx="340" cy="80" r="5" fill="#facc15" />
</svg>
