<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ToolStack - Redirecting...</title>
    <script>
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // into just query strings, and then redirects the browser to the new url with
      // the correct path so the SPA can load it correctly.
      var pathSegmentsToKeep = window.location.hostname.endsWith('github.io') ? 1 : 0;
      var l = window.location;
      var path = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      var redirectUrl = l.protocol + '//' + l.host +
        (pathSegmentsToKeep > 0 ? '/' + l.pathname.slice(1).split('/')[0] : '') +
        '/?p=' + encodeURIComponent(path) +
        (l.search ? '&q=' + encodeURIComponent(l.search.slice(1)) : '') +
        l.hash;
      l.replace(redirectUrl);
    </script>
  </head>
  <body>
  </body>
</html>
